  <g transform="translate(256 256) skewX(-12) translate(-256 -256)">
    <!-- heavy C -->
    <path d="M372 336 A128 128 0 1 1 372 176" fill="none" stroke="#FFFFFF" stroke-width="64"/>
    <!-- G bar as a start/finish line: 2 rows x 4 checks -->
