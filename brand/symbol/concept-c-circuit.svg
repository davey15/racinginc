      <rect x="260" y="224" width="40" height="32" fill="#FFFFFF"/><rect x="300" y="224" width="40" height="32" fill="#0A0A0B"/>
      <rect x="340" y="224" width="40" height="32" fill="#FFFFFF"/><rect x="380" y="224" width="40" height="32" fill="#0A0A0B"/>
      <rect x="260" y="256" width="40" height="32" fill="#0A0A0B"/><rect x="300" y="256" width="40" height="32" fill="#FFFFFF"/>
      <rect x="340" y="256" width="40" height="32" fill="#0A0A0B"/><rect x="380" y="256" width="40" height="32" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
